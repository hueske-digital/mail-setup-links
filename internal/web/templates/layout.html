<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>{{template "title" .}} – {{.OrgName}}</title>
    <link rel="preload" href="{{asset "fonts/Mona-Sans.woff2"}}" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="{{asset "style.css"}}" />
    <script src="{{asset "app.js"}}" defer></script>
  </head>
  <body>
    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="icon-phone" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5" /><path d="M11 18.5h2" /></symbol>
      <symbol id="icon-android" viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="3" /><circle cx="12" cy="6" r="0.6" /></symbol>
      <symbol id="icon-laptop" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="11" rx="1.5" /><path d="M2 19.5h20" /></symbol>
      <symbol id="icon-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="m3.5 7.5 8.5 6 8.5-6" /></symbol>
      <symbol id="icon-send" viewBox="0 0 24 24"><path d="M21 3 3 10.5l7 2.5 2.5 7L21 3Z" /><path d="m10 13 4.5-4.5" /></symbol>
      <symbol id="icon-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3c3.2 3.4 3.2 14.6 0 18M12 3c-3.2 3.4-3.2 14.6 0 18" /></symbol>
      <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" /></symbol>
      <symbol id="icon-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6" /></symbol>
      <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14" /></symbol>
    </svg>
    <header class="brand"><p>{{.OrgName}}</p></header>
    <main>
      {{template "content" .}}
    </main>
    <p class="status" role="status" id="status"></p>
  </body>
</html>
