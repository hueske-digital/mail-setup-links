{{define "title"}}Einrichtungslink{{end}}
{{define "content"}}
<div class="intro">
<p class="eyebrow">E-Mail-Konto einrichten</p>
<h1>Dein Link ist <em>fertig</em></h1>
<p class="lead">
  Richte <strong class="address">{{.Email}}</strong> jetzt ein oder gib den Link weiter. Er ist
  gültig bis {{.Expires}}.
</p>
</div>
<div class="body">
<div class="panel">
  <dl class="values">
    <div class="is-wide">
      <dt>Einrichtungslink</dt>
      <dd>
        <span>{{.Link}}</span>
        <button type="button" class="copy" data-copy="{{.Link}}" aria-label="Einrichtungslink kopieren" hidden>Kopieren</button>
      </dd>
    </div>
  </dl>
  <p class="actions">
    <a class="button" href="{{.Link}}">Jetzt einrichten</a>
    <a href="/">Weiteren Link erstellen</a>
  </p>
</div>
</div>
{{end}}
